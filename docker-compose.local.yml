services:
  newsnow:
    build: .
    ports:
      - '4444:4444'
    volumes:
      - newsnow_data:/usr/app/.data
    environment:
      - G_CLIENT_ID=
      - G_CLIENT_SECRET=
      - JWT_SECRET=
      - INIT_TABLE=true
      - ENABLE_CACHE=true
      - NODE_TLS_REJECT_UNAUTHORIZED=0

volumes:
  newsnow_data:
    name: newsnow_data
